[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "router-eval"
version = "0.1.0"
description = "BYOK model-routing evaluation harness with a quality-floor gate, multi-vendor providers, and LLM-as-judge scoring."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
router-eval = "router_eval.cli:main"

[tool.setuptools.dynamic]
# Single source of truth for runtime deps stays requirements.txt (that's
# what the README tells people to `pip install -r`) -- this just lets
# `pip install -e .` read the same file instead of a second, driftable copy.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["router_eval*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
